name: Nekory Kernel - bangkk

on:
  workflow_dispatch:

  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: nekory-bangkk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build SM6375 - bangkk
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ARCH: arm64
      SUBARCH: arm64
      TARGET_PRODUCT: bangkk
      LLVM: "1"
      KCFLAGS: -Wno-incompatible-function-pointer-types -Wno-error
      DEFCONFIG: nekory_bangkk_defconfig

    steps:
      - name: Identify build
        run: |
          echo "bangkkuser@github-actions-NekoryKernel"
          echo "Device: Motorola SM6375"
          echo "Target: bangkk"
          echo "Kernel branch: lineage-24.0"
          echo "AnyKernel3 branch: motorola"

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: NekoryKernel/android_kernel_motorola_sm6375
          ref: lineage-24.0
          path: kernel
          submodules: recursive
          fetch-depth: 0

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: NekoryKernel/AnyKernel3
          ref: motorola
          path: AnyKernel3
          fetch-depth: 1

      - name: Set AnyKernel3 kernel string
        run: |
          sed -i 's/^kernel\.string=.*/kernel.string=NekoryKernel-SM6375/' \
            AnyKernel3/anykernel.sh

      - name: Checkout CI configuration
        uses: actions/checkout@v4
        with:
          repository: NekoryKernel/nekory-ci
          path: ci

      - name: Compute kernel localversion
        run: |
          echo "LOCALVERSION=-$(git -C kernel rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio \
            curl flex git kmod libelf-dev \
            libssl-dev libncurses-dev lld \
            llvm make pahole perl python3 \
            rsync unzip zip gcc g++

      - name: Install AOSP Clang
        run: |
          TOOLCHAIN="$RUNNER_TEMP/aosp-clang"

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            --branch android-15.0.0_r3 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$TOOLCHAIN"

          git -C "$TOOLCHAIN" sparse-checkout set clang-r498229b

          echo "$TOOLCHAIN/clang-r498229b/bin" >> "$GITHUB_PATH"

      - name: Validate toolchain
        run: |
          clang --version
          clang++ --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-objdump --version
          llvm-readelf --version
          llvm-strip --version

      - name: Validate repositories
        run: |
          test -f kernel/Makefile
          test -f AnyKernel3/anykernel.sh
          test -f AnyKernel3/tools/ak3-core.sh
          test -f ci/$DEFCONFIG

          grep -q 'device.name1=bangkk' AnyKernel3/anykernel.sh
          grep -qx 'kernel.string=NekoryKernel-SM6375' AnyKernel3/anykernel.sh

      - name: Prepare defconfig
        run: |
          cp "ci/$DEFCONFIG" \
            "kernel/arch/arm64/configs/$DEFCONFIG"

          mkdir -p "$GITHUB_WORKSPACE/kernel/out"

      - name: Configure kernel
        run: |
          make -C kernel \
            O="$GITHUB_WORKSPACE/kernel/out" \
            ARCH=arm64 \
            LLVM=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            "$DEFCONFIG"

          make -C kernel \
            O="$GITHUB_WORKSPACE/kernel/out" \
            ARCH=arm64 \
            LLVM=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            olddefconfig

          CONFIG="kernel/out/.config"

          grep -qx 'CONFIG_LOCALVERSION="-moto-NekoryKernel"' "$CONFIG"
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' "$CONFIG"
          grep -qx 'CONFIG_KSU_SUSFS=y' "$CONFIG"
          grep -qx 'CONFIG_KSU=y' "$CONFIG"

          echo "Kernel configuration validated."

      - name: Compile kernel
        run: |
          make -C kernel \
            O="$GITHUB_WORKSPACE/kernel/out" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            KCFLAGS="$KCFLAGS" \
            -j"$(nproc)" \
            Image.gz dtbs modules

      - name: Install modules to staging
        run: |
          make -C kernel \
            O="$GITHUB_WORKSPACE/kernel/out" \
            ARCH=arm64 \
            LLVM=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            modules_install \
            INSTALL_MOD_STRIP=1 \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules-staging"

          # build/ e source/ apontam pro fonte do runner, nao servem no aparelho
          # e o zip seguiria esses links e empacotaria o kernel inteiro
          rm -f modules-staging/lib/modules/*/build \
                modules-staging/lib/modules/*/source
          du -sh modules-staging

      - name: Collect build outputs
        run: |
          mkdir -p artifacts

          cp kernel/out/arch/arm64/boot/Image \
            artifacts/Image

          cp kernel/out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp -a kernel/out/arch/arm64/boot/dts \
            artifacts/dts

          cp kernel/out/.config artifacts/kernel.config

          make -s -C kernel \
            O="$GITHUB_WORKSPACE/kernel/out" \
            ARCH=arm64 \
            kernelrelease \
            > artifacts/kernel-release.txt

          if [ -d modules-staging/lib/modules ]; then
            cp -a modules-staging/lib/modules artifacts/modules
          fi

          tar -czf artifacts/dtbs.tar.gz \
            -C artifacts dts

          if [ -d artifacts/modules ]; then
            tar -czf artifacts/modules.tar.gz \
              -C artifacts modules
          fi

      - name: Stage AnyKernel3 package
        run: |
          # AnyKernel3 uses Image as its kernel payload.
          cp kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          # The installer copies this directory into vendor_boot.
          if [ -d modules-staging/lib/modules ]; then
            mkdir -p AnyKernel3/vendor_ramdisk/lib/modules

            cp -a modules-staging/lib/modules/. \
              AnyKernel3/vendor_ramdisk/lib/modules/
          fi

          mkdir -p artifacts

          cd AnyKernel3

          du -sh .
          df -h /

          zip -ry ../artifacts/NekoryKernel-bangkk.zip . \
            -x ".git" ".git/*"

          ls -lh ../artifacts/NekoryKernel-bangkk.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoryKernel-bangkk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
